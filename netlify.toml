[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/sat-blueprint"
  to = "/"
  status = 301

[[redirects]]
  from = "/program"
  to = "/methodology/"
  status = 301

[[redirects]]
  from = "/program/*"
  to = "/methodology/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

# /book is now the on-site booking page (book/index.html), which embeds the
# HighLevel scheduler. Old links to /book land there instead of redirecting.
